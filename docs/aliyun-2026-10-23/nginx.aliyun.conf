# 替换全部delivery.example.com 先仅启用80端口部分签发证书 再启用443部分
log_format delivery_safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name delivery.example.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location ~ ^/MP_verify_[A-Za-z0-9]+\.txt$ { root /var/www/wechat; try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name delivery.example.com;
    ssl_certificate /etc/letsencrypt/live/delivery.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/delivery.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 80m;
    access_log /var/log/nginx/delivery.access.log delivery_safe;
    error_log /var/log/nginx/delivery.error.log warn;
    location ~ ^/MP_verify_[A-Za-z0-9]+\.txt$ { root /var/www/wechat; try_files $uri =404; }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
    }
}
