# 生产 Nginx 反向代理模板
# 使用：把 __DOMAIN__ 替换为真实已备案域名后放到 /etc/nginx/sites-available/delivery
#   sed "s#__DOMAIN__#delivery.example.com#g" deploy/nginx-production.conf \
#     > /etc/nginx/sites-available/delivery
#   ln -sf /etc/nginx/sites-available/delivery /etc/nginx/sites-enabled/delivery
#   nginx -t && systemctl reload nginx
#
# 证书路径适用于 certbot --nginx 自动签发（/etc/letsencrypt/live/<域名>/）
# 若使用阿里云下载的证书，改为自定义路径即可。

upstream delivery_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # certbot 校验用路径必须放通
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;      # nginx >= 1.25.1 可改为：listen 443 ssl; + http2 on;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # X-Content-Type-Options / X-Frame-Options / Referrer-Policy 已由 Next.js (next.config.ts) 输出，
    # 此处不再重复设置，避免响应头出现重复值

    # 单页图片上限 15MB × 最多 5 页，留出余量
    client_max_body_size 80m;
    client_body_timeout  120s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/delivery.access.log;
    error_log  /var/log/nginx/delivery.error.log warn;

    location /api/health {
        access_log off;
        proxy_pass http://delivery_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Next.js 静态产物：长缓存
    location /_next/static/ {
        proxy_pass http://delivery_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://delivery_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 必须带上 https，否则应用层会话 Cookie 不会设置 Secure，会出现登录后掉线
        proxy_set_header X-Forwarded-Proto https;

        # 图片上传 + OCR 调用链耗时较长，超时放宽
        proxy_connect_timeout 30s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;

        proxy_set_header Connection "";
        proxy_buffering off;
    }
}
