# http上下文包含本文件；server使用access_log ... delivery_json。
# 现网由维护脚本保留现有TLS配置后插入，不整份覆盖站点。
log_format delivery_json escape=json
  '{"timestamp":"$time_iso8601","event":"nginx.access",'
  '"request_id":"$request_id","method":"$request_method","path":"$uri",'
  '"status":$status,"duration_seconds":$request_time,'
  '"upstream_seconds":"$upstream_response_time","upstream_status":"$upstream_status",'
  '"request_bytes":$request_length,"response_bytes":$body_bytes_sent,"client_ip":"$remote_addr"}';
# 在代理location内：proxy_set_header X-Request-ID $request_id;
# 应用返回X-Request-ID；Nginx直接拒绝的请求也返回编号：
# add_header X-Request-ID $request_id always;
# proxy_hide_header X-Request-ID;  # 与上一行配套，防止重复响应头
