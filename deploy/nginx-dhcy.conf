# 食安链 www.dhcy.top：保留原IP证书供旧地址跳转，独立签发/续期域名证书。
# 安装为 /etc/nginx/sites-available/shian-domain.conf，链接至 sites-enabled/shian-www.conf。
# 证书：/opt/certbot/bin/certbot certonly --webroot -w /var/www/html
#       -d www.dhcy.top --cert-name shian-domain --non-interactive
# 修改前备份现有Nginx与私有环境；通过 nginx -t 后再 reload。
log_format delivery_domain_json escape=json
  '{"timestamp":"$time_iso8601","event":"nginx.access",'
  '"request_id":"$request_id","method":"$request_method","path":"$uri",'
  '"status":$status,"duration_seconds":$request_time,'
  '"upstream_seconds":"$upstream_response_time","upstream_status":"$upstream_status",'
  '"request_bytes":$request_length,"response_bytes":$body_bytes_sent,"client_ip":"$remote_addr"}';

server {
    listen 80;
    server_name www.dhcy.top;
    add_header X-Request-ID $request_id always;
    access_log /var/log/nginx/shian-domain.access.log delivery_domain_json;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location = /MP_verify_vXQUGqwSrP4cYhM5.txt {
        root /var/www/html;
        default_type text/plain;
    }
    location / { return 308 https://www.dhcy.top$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name www.dhcy.top;
    ssl_certificate /etc/letsencrypt/live/shian-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shian-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 80m;
    client_body_timeout 120s;
    add_header X-Request-ID $request_id always;
    access_log /var/log/nginx/shian-domain.access.log delivery_domain_json;
    location = /MP_verify_vXQUGqwSrP4cYhM5.txt {
        root /var/www/html;
        default_type text/plain;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}
