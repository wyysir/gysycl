<!DOCTYPE html>
<html lang="zh-CN" data-theme="a" data-device="desktop">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>食安链 · UI 交互稿（三版对比）</title>
<style>
:root { --studio:#1c1f24; --studio-2:#2a2e34; --studio-line:#3a3f47; --studio-text:#e8eaed; --studio-muted:#9aa0a8; }
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:var(--studio); color:var(--studio-text); font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",system-ui,sans-serif; }
button,input,select{ font:inherit; }
button{ cursor:pointer; }
img{ max-width:100%; display:block; }

/* ===== Studio chrome ===== */
.studio{ display:flex; flex-direction:column; height:100%; }
.studio-bar{ flex:none; display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center; padding:12px 18px; background:var(--studio-2); border-bottom:1px solid var(--studio-line); }
.studio-brand{ font-weight:650; letter-spacing:.04em; margin-right:8px; }
.studio-brand small{ display:block; font-weight:400; color:var(--studio-muted); font-size:11px; letter-spacing:0; margin-top:2px; }
.seg{ display:flex; background:#16181c; border:1px solid var(--studio-line); border-radius:10px; padding:3px; gap:2px; }
.seg button{ border:0; background:transparent; color:var(--studio-muted); padding:7px 12px; border-radius:8px; font-size:13px; }
.seg button.is-on{ background:#fff; color:#111; font-weight:600; }
.studio-note{ flex:1; min-width:240px; font-size:12px; line-height:1.55; color:var(--studio-muted); }
.studio-stage{ flex:1; overflow:auto; display:flex; justify-content:center; align-items:flex-start; padding:28px 20px 40px; background:
  radial-gradient(circle at 20% 0, rgba(255,255,255,.04), transparent 26rem), var(--studio); }
.device{ background:#0d0f12; box-shadow:0 30px 70px rgba(0,0,0,.45); transition:width .25s ease, height .25s ease, border-radius .25s ease; overflow:hidden; }
html[data-device="desktop"] .device{ width:min(1440px,100%); height:calc(100vh - 130px); min-height:760px; border-radius:16px; }
html[data-device="tablet"] .device{ width:768px; height:calc(100vh - 130px); min-height:780px; border-radius:18px; }
html[data-device="mobile"] .device{ width:390px; height:844px; border-radius:36px; border:10px solid #0a0a0c; }
.device-screen{ height:100%; overflow:hidden; background:var(--paper); color:var(--ink); position:relative; }

/* ===== Themes ===== */
[data-theme="a"]{
  --brand:#173f35; --brand-deep:#102e27; --accent:#e9794a; --accent-hover:#d46638;
  --paper:#f3f0e7; --surface:#fffdf8; --surface-2:#e7efe9;
  --sidebar-bg:#102e27; --sidebar-text:#eef5f0; --sidebar-muted:#9bb0a6;
  --sidebar-active-bg:#1b4a40; --sidebar-active:#fff; --sidebar-hover:rgba(255,255,255,.06);
  --ink:#18241f; --muted:#5c6b64; --line:#ddd6c7; --line-strong:#c3baa8;
  --gold:#e9b949; --green:#217056; --green-soft:#dceee5; --amber:#a86a12; --amber-soft:#f8ecd3; --red:#b8473f; --red-soft:#f7deda;
  --focus:#e9794a; --radius:16px; --radius-sm:12px; --shadow:0 10px 28px rgba(16,46,39,.08);
  --login-story-bg:radial-gradient(circle at 88% 8%, rgba(233,121,74,.28), transparent 22rem), var(--brand-deep);
  --login-story-color:#f7f1e5; --topbar-bg:#fffdf8ed;
}
[data-theme="b"]{
  --brand:#76543e; --brand-deep:#543b29; --accent:#76543e; --accent-hover:#654832;
  --paper:#f6f5f1; --surface:#fffefa; --surface-2:#f4ede3;
  --sidebar-bg:#f4ede3; --sidebar-text:#282b2d; --sidebar-muted:#6f685e;
  --sidebar-active-bg:#efe4d4; --sidebar-active:#76543e; --sidebar-hover:#ebe3d6;
  --ink:#282b2d; --muted:#6f685e; --line:#e5e0d7; --line-strong:#a99a88;
  --gold:#d0a350; --green:#2d6b4c; --green-soft:#edf5ee; --amber:#8a5700; --amber-soft:#fff4d6; --red:#ad3d32; --red-soft:#fbede9;
  --focus:#8a651f; --radius:12px; --radius-sm:10px; --shadow:0 8px 24px rgba(56,52,53,.08);
  --login-story-bg:var(--surface-2); --login-story-color:var(--ink); --topbar-bg:#ffffffed;
}
[data-theme="c"]{
  --brand:#0f7a6c; --brand-deep:#0b5e54; --accent:#0f7a6c; --accent-hover:#0c685c;
  --paper:#f3f5f7; --surface:#fff; --surface-2:#eef2f4;
  --sidebar-bg:#fff; --sidebar-text:#1a1d21; --sidebar-muted:#6b7178;
  --sidebar-active-bg:#e6f4f1; --sidebar-active:#0f7a6c; --sidebar-hover:#f3f6f8;
  --ink:#1a1d21; --muted:#5e666e; --line:#e3e7eb; --line-strong:#c5ccd3;
  --gold:#0f7a6c; --green:#1f7a58; --green-soft:#e5f6ee; --amber:#9a6700; --amber-soft:#fff3d6; --red:#c4453a; --red-soft:#fde8e6;
  --focus:#0f7a6c; --radius:10px; --radius-sm:8px; --shadow:0 1px 2px rgba(16,24,32,.06), 0 8px 24px rgba(16,24,32,.05);
  --login-story-bg:linear-gradient(180deg,#0b5e54,#0f7a6c 60%,#149484); --login-story-color:#f4fffb; --topbar-bg:#ffffff;
}

/* ===== App shell ===== */
.app{ height:100%; display:grid; grid-template-columns:232px minmax(0,1fr); background:var(--paper); color:var(--ink); }
html[data-device="tablet"] .app, html[data-device="mobile"] .app{ grid-template-columns:1fr; }
.sidebar{ background:var(--sidebar-bg); color:var(--sidebar-text); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:18px 12px 14px; }
html[data-device="tablet"] .sidebar, html[data-device="mobile"] .sidebar{ display:none; }
.logo{ display:flex; gap:10px; align-items:center; padding:6px 10px 18px; text-decoration:none; color:inherit; }
.mark{ width:36px; height:36px; border-radius:12px; background:transparent; display:block; flex:none; overflow:hidden; }
.mark svg{ width:100%; height:100%; display:block; }
.login-story .mark{ width:48px; height:48px; border-radius:14px; }
.logo strong{ display:block; font-size:16px; letter-spacing:.08em; }
.logo span{ display:block; font-size:11px; color:var(--sidebar-muted); margin-top:1px; }
.scope{ margin:0 8px 16px; padding:10px 12px; border:1px solid color-mix(in srgb, var(--sidebar-text) 12%, transparent); border-radius:var(--radius-sm); background:color-mix(in srgb, #fff 8%, transparent); }
[data-theme="b"] .scope, [data-theme="c"] .scope{ background:#fff; border-color:var(--line); }
.scope small{ display:block; font-size:11px; color:var(--sidebar-muted); }
.scope b{ display:block; margin-top:3px; font-size:13px; font-weight:600; }
.nav{ display:flex; flex-direction:column; gap:4px; flex:1; overflow:auto; }
.nav-sec{ margin:14px 12px 6px; font-size:11px; color:var(--sidebar-muted); letter-spacing:.08em; }
.nav-item{ display:flex; align-items:center; gap:10px; min-height:44px; padding:8px 12px; border-radius:var(--radius-sm); color:inherit; text-decoration:none; border:0; background:transparent; width:100%; text-align:left; font-size:14px; }
.nav-item:hover{ background:var(--sidebar-hover); }
.nav-item.is-on{ background:var(--sidebar-active-bg); color:var(--sidebar-active); font-weight:600; }
[data-theme="a"] .nav-item.is-on{ box-shadow:inset 3px 0 var(--accent); }
[data-theme="b"] .nav-item.is-on{ box-shadow:inset 3px 0 var(--gold); }
[data-theme="c"] .nav-item.is-on{ box-shadow:inset 3px 0 var(--brand); }
.nav-ico{ width:18px; height:18px; display:grid; place-items:center; opacity:.9; }
.user-card{ display:flex; align-items:center; gap:10px; padding:12px 8px 2px; border-top:1px solid color-mix(in srgb, var(--sidebar-text) 12%, transparent); margin-top:10px; }
.avatar{ width:32px; height:32px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; font-size:13px; font-weight:650; }
[data-theme="b"] .avatar, [data-theme="c"] .avatar{ background:var(--brand); }
.user-card strong{ display:block; font-size:13px; }
.user-card span{ display:block; font-size:11px; color:var(--sidebar-muted); }
.icon-btn{ width:36px; height:36px; border-radius:9px; border:1px solid color-mix(in srgb, var(--sidebar-text) 16%, transparent); background:transparent; color:inherit; margin-left:auto; }

.main{ display:flex; flex-direction:column; min-width:0; min-height:0; }
.topbar{ flex:none; min-height:60px; display:flex; align-items:center; gap:12px; padding:10px 24px; background:var(--topbar-bg); border-bottom:1px solid var(--line); backdrop-filter:blur(8px); }
html[data-device="mobile"] .topbar{ padding:10px 14px; }
.crumb{ font-size:13px; color:var(--muted); }
.crumb b{ color:var(--ink); font-weight:600; }
.mobile-title{ display:none; font-size:16px; font-weight:650; }
html[data-device="mobile"] .crumb{ display:none; }
html[data-device="mobile"] .mobile-title{ display:block; }
.topbar-actions{ margin-left:auto; display:flex; align-items:center; gap:8px; }
.content{ flex:1; overflow:auto; padding:24px 24px 48px; }
html[data-device="mobile"] .content{ padding:16px 16px 96px; }
html[data-device="mobile"] .content.no-pad{ padding:0 0 72px; }

.mobile-nav{ display:none; }
html[data-device="mobile"] .mobile-nav, html[data-device="tablet"] .mobile-nav{
  display:flex; position:sticky; bottom:0; background:var(--surface); border-top:1px solid var(--line);
  padding:6px 8px calc(8px + env(safe-area-inset-bottom)); z-index:20;
}
html[data-device="tablet"] .app{ display:flex; flex-direction:column; }
html[data-device="tablet"] .main, html[data-device="mobile"] .main{ flex:1; min-height:0; display:flex; flex-direction:column; }
.mobile-nav a, .mobile-nav button{ flex:1; border:0; background:transparent; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; font-size:11px; text-decoration:none; }
.mobile-nav .is-on{ color:var(--brand); font-weight:650; }
.mobile-nav .fab-wrap{ flex:1; display:flex; justify-content:center; }
.mobile-nav .fab, .fab{ width:52px; height:52px; margin-top:-22px; border-radius:50%; border:0; background:var(--accent); color:#fff; display:grid; place-items:center; box-shadow:0 8px 18px color-mix(in srgb, var(--accent) 40%, transparent); flex:none; padding:0; font-size:22px; line-height:1; }
[data-theme="b"] .mobile-nav .fab, [data-theme="c"] .mobile-nav .fab{ background:var(--brand); color:#fff; }
html[data-device="mobile"] .topbar .btn--primary,
html[data-device="mobile"] .topbar .btn--outline,
html[data-device="mobile"] .page-head .btn--primary{ display:none; }
html[data-device="mobile"] .editor .sticky-act{ display:none; }
.action-dock{ display:none; }
html[data-device="mobile"] .action-dock, html[data-device="tablet"] .action-dock{ display:flex; gap:8px; flex-wrap:wrap; flex:none; padding:10px 16px; background:var(--surface); border-top:1px solid var(--line); z-index:19; }
html[data-device="mobile"] .action-dock .btn--primary, html[data-device="tablet"] .action-dock .btn--primary{ margin-left:auto; }
.main:has(.action-dock) .fab{ margin-top:0; width:44px; height:44px; }
.line-cards{ display:none; }
html[data-device="mobile"] .line-table{ display:none; }
html[data-device="mobile"] .line-cards{ display:grid; gap:8px; padding:12px; }
html[data-device="mobile"] .editor.review-page .line-cards,
html[data-device="tablet"] .editor.review-page .line-cards{
  flex:1; min-height:0; overflow:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-y; padding-bottom:20px;
}
.line-card{ border:1px solid var(--line); border-radius:12px; padding:12px; background:#fff; }
.line-card.is-on{ outline:2px solid var(--focus); }
.line-card.warn{ background:var(--amber-soft); }
.line-card.bad{ background:var(--red-soft); }
.line-card h3{ margin:0 0 4px; font-size:15px; }
.line-card p{ margin:0; font-size:12px; color:var(--muted); }
.line-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px; font-variant-numeric:tabular-nums; }
.line-grid span{ display:block; font-size:11px; color:var(--muted); }
.line-grid b{ display:block; font-size:14px; font-weight:600; color:var(--ink); }
.photos{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; }
.photo .fake-slip{ height:100%; }

/* ===== Shared widgets ===== */
.page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
.page-title{ margin:0; font-size:28px; line-height:1.25; font-weight:650; letter-spacing:-.02em; }
[data-theme="c"] .page-title{ font-size:24px; font-weight:600; }
.page-sub{ margin:6px 0 0; font-size:13px; color:var(--muted); }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:40px; padding:8px 16px; border-radius:var(--radius-sm); border:1px solid transparent; background:var(--surface-2); color:var(--ink); font-size:14px; font-weight:550; }
.btn--primary{ background:var(--accent); color:#fff; }
[data-theme="b"] .btn--primary, [data-theme="c"] .btn--primary{ background:var(--brand); }
.btn--primary:hover{ background:var(--accent-hover); }
.btn--outline{ background:#fff; border-color:var(--line-strong); color:var(--brand); }
.btn--ghost{ background:transparent; }
.btn--danger{ background:#fff; color:var(--red); border-color:var(--red); }
.btn--small{ min-height:36px; padding:6px 12px; font-size:13px; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
.card-h{ display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line); }
.card-h h2{ margin:0; font-size:16px; font-weight:650; }
.card-b{ padding:16px 20px; }
.pill{ display:inline-flex; align-items:center; padding:3px 8px; border-radius:999px; font-size:12px; line-height:18px; background:var(--surface-2); color:var(--muted); }
.pill--ok{ background:var(--green-soft); color:var(--green); }
.pill--wait{ background:var(--amber-soft); color:var(--amber); }
.pill--bad{ background:var(--red-soft); color:var(--red); }
.pill--info{ background:color-mix(in srgb, var(--brand) 12%, #fff); color:var(--brand); }
.notice{ display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:var(--radius-sm); background:var(--amber-soft); color:var(--amber); border:1px solid color-mix(in srgb, var(--amber) 25%, #fff); font-size:13px; line-height:1.55; }
.notice--bad{ background:var(--red-soft); color:var(--red); border-color:color-mix(in srgb, var(--red) 25%, #fff); }
.notice b{ display:block; }
.table{ width:100%; border-collapse:collapse; }
.table th,.table td{ padding:12px 14px; text-align:left; font-size:14px; border-bottom:1px solid var(--line); }
.table th{ font-weight:500; color:var(--muted); background:color-mix(in srgb, var(--surface-2) 70%, #fff); }
.table tr:hover td{ background:color-mix(in srgb, var(--surface-2) 50%, #fff); }
.money{ font-variant-numeric:tabular-nums; text-align:right; }
.link{ color:var(--brand); background:none; border:0; padding:0; font-weight:550; }
.field{ display:flex; flex-direction:column; gap:6px; font-size:13px; }
.field input,.field select,.input,.select{ min-height:40px; border:1px solid var(--line-strong); border-radius:var(--radius-sm); padding:8px 12px; background:#fff; color:var(--ink); }
.field input:focus,.input:focus,.select:focus{ outline:2px solid var(--focus); outline-offset:1px; border-color:var(--focus); }
.warn-cell{ background:var(--amber-soft) !important; }
.err-cell{ background:var(--red-soft) !important; }
.toast{ position:absolute; left:50%; bottom:28px; transform:translateX(-50%); background:#1c1f24; color:#fff; padding:10px 16px; border-radius:999px; font-size:13px; z-index:50; box-shadow:var(--shadow); display:none; }
.toast.show{ display:block; }
html[data-device="mobile"] .toast{ bottom:92px; }
.sheet{ position:absolute; inset:0; background:rgba(16,20,24,.45); display:flex; align-items:flex-end; justify-content:center; z-index:40; }
.sheet .panel{ width:min(480px,100%); background:var(--surface); border-radius:16px 16px 0 0; padding:20px; }
html[data-device="desktop"] .sheet{ align-items:center; }
html[data-device="desktop"] .sheet .panel{ border-radius:var(--radius); }
.hidden{ display:none !important; }
.more-panel{ position:absolute; left:12px; right:12px; bottom:76px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:8px; z-index:30; }
.more-panel a{ display:flex; gap:10px; align-items:center; padding:12px; border-radius:10px; text-decoration:none; color:var(--ink); }
.more-panel a:hover{ background:var(--surface-2); }

/* Login */
.login{ min-height:100%; display:grid; grid-template-columns:1fr 1.05fr; background:var(--paper); }
html[data-device="tablet"] .login, html[data-device="mobile"] .login{ grid-template-columns:1fr; }
.login-story{ background:var(--login-story-bg); color:var(--login-story-color); padding:48px 44px; display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden; }
html[data-device="tablet"] .login-story, html[data-device="mobile"] .login-story{ padding:28px 24px 16px; min-height:auto; }
.login-story h1{ font-size:clamp(32px,4vw,52px); line-height:1.2; margin:12px 0 0; font-weight:650; }
.login-story h1 em{ font-style:normal; color:var(--accent); }
[data-theme="c"] .login-story h1 em{ color:#d7fff4; }
.login-story p{ max-width:420px; line-height:1.8; opacity:.78; font-size:14px; }
.login-panel{ display:grid; place-items:center; padding:32px 24px; }
.login-card{ width:min(420px,100%); background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:32px; box-shadow:var(--shadow); }
.login-card h2{ margin:0 0 6px; font-size:24px; }
.login-card .hint{ color:var(--muted); font-size:13px; margin-bottom:22px; }
.login-card .field{ margin-bottom:14px; }
.login-submit{ width:100%; margin-top:8px; min-height:44px; }
.demos{ margin-top:18px; }
.demos p{ margin:0 0 8px; font-size:12px; color:var(--muted); }
.demos div{ display:flex; gap:8px; flex-wrap:wrap; }
.demo{ border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 10px; font-size:12px; color:var(--ink); }
.login-kicker{ font-size:12px; letter-spacing:.16em; color:var(--accent); font-weight:700; }
[data-theme="c"] .login-kicker{ color:#d7fff4; }
[data-theme="c"] .login-story h1 em{ color:#d7fff4; text-decoration:underline; text-decoration-thickness:3px; text-underline-offset:8px; text-decoration-color:rgba(215,255,244,.45); }
.feat{ display:flex; gap:16px; margin-top:28px; font-size:12px; opacity:.8; }
.feat b{ display:block; font-size:13px; margin-bottom:2px; }

/* Dashboard */
.stats{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:18px; }
html[data-device="tablet"] .stats{ grid-template-columns:repeat(2,1fr); }
html[data-device="mobile"] .stats{ grid-template-columns:1fr 1fr; }
.stat{ display:block; text-decoration:none; color:inherit; padding:18px; }
.stat span{ display:block; color:var(--muted); font-size:13px; }
.stat strong{ display:block; margin-top:6px; font-size:30px; letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
.stat em{ display:block; margin-top:4px; font-style:normal; font-size:12px; color:var(--muted); }
.dash-grid{ display:grid; grid-template-columns:1.4fr .8fr; gap:14px; margin-bottom:18px; }
html[data-device="mobile"] .dash-grid, html[data-device="tablet"] .dash-grid{ grid-template-columns:1fr; }

/* Upload */
.choice{ width:100%; display:flex; align-items:center; gap:12px; text-align:left; padding:14px 16px; border:1px solid var(--line); background:var(--surface); border-radius:var(--radius); margin-bottom:14px; }
.choice small{ display:block; color:var(--muted); font-size:12px; }
.choice strong{ display:block; font-size:16px; margin:2px 0; }
.choice b{ margin-left:auto; color:var(--muted); font-weight:500; }
.pick{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
.pick .btn{ min-height:52px; font-size:15px; }
.photos{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; }
html[data-device="mobile"] .photos{ grid-template-columns:repeat(3,1fr); }
.photo{ position:relative; aspect-ratio:3/4; border-radius:12px; overflow:hidden; background:#ece7dc; border:1px dashed var(--line-strong); }
.photo img, .photo .fake{ width:100%; height:100%; object-fit:cover; }
.fake-slip{ background:repeating-linear-gradient(#f7f3ea,#f7f3ea 18px,#eadfcd 19px); padding:10px 8px; font-size:10px; color:#5a5146; line-height:1.55; height:100%; }
.fake-slip b{ display:block; font-size:11px; margin-bottom:4px; }
.photo i{ position:absolute; left:6px; top:6px; background:#111c; color:#fff; font-style:normal; font-size:10px; padding:1px 5px; border-radius:4px; }
.photo .rm{ position:absolute; right:4px; top:4px; width:24px; height:24px; border:0; border-radius:50%; background:#fff; }
.actions-bar{ display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; align-items:center; }
html[data-device="mobile"] .actions-bar .btn--primary{ flex:1; min-height:48px; }

/* Review */
.review-head{ display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:12px; flex-wrap:wrap; }
html[data-device="mobile"] .review-head .page-title{ font-size:20px; }
.meta{ display:flex; flex-wrap:wrap; gap:8px 14px; color:var(--muted); font-size:13px; margin-top:6px; }

<body>
<div class="studio">
  <header class="studio-bar">
    <div class="studio-brand">食安链 UI 交互稿<small>可点击 · 不改你的项目代码</small></div>
    <div class="seg" id="themeSeg" role="tablist" aria-label="设计版本">
      <button type="button" class="is-on" data-theme="a">A 林影食安</button>
      <button type="button" data-theme="b">B 台账棕</button>
      <button type="button" data-theme="c">C 清台作业</button>
    </div>
    <div class="seg" id="deviceSeg" aria-label="预览尺寸">
      <button type="button" class="is-on" data-device="desktop">桌面 1440</button>
      <button type="button" data-device="tablet">平板 768</button>
      <button type="button" data-device="mobile">手机 390</button>

    <p class="studio-note" id="themeNote"></p>
  </header>
  <div class="studio-stage">
    <div class="device"><div class="device-screen" id="screen"></div></div>
  </div>
</div>

<script>
const NOTES = {
  a: "A 林影食安：恢复墨绿侧栏与珊瑚色主按钮，登录左侧用深色品牌墙，状态色保持独立，更有食安识别度。",
  b: "B 台账棕：沿用你现在的棕色方向，但把绿/黄/红从棕色里拆出来，侧栏改浅色台账纸，更稳、更像财务单据系统。",
  c: "C 清台作业：白底青绿强调，信息更疏朗；手机底栏正中是「新建单据」。适合天天对单的现场操作。"
};
const ICO = {
  home: '<svg class="ico" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>',
  plus: '<svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  file: '<svg class="ico" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></svg>',
  check: '<svg class="ico" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>',
  chart: '<svg class="ico" viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="M8 16V9m4 7V6m4 10v-5"/></svg>',
  box: '<svg class="ico" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7"/></svg>',
  db: '<svg class="ico" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>',
  gear: '<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10L5.6 18.4"/></svg>',
  more: '<svg class="ico" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></svg>',
  cam: '<svg class="ico" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  album: '<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="m21 16-5-5-8 8"/></svg>'
};

const BRAND_MARK = `<span class="mark" aria-hidden="true"><svg viewBox="0 0 64 64" focusable="false"><rect width="64" height="64" rx="16" fill="#775740"/><path d="M17 21h30M20 21v25h24V21M25 28h14M25 35h14M25 42h8" fill="none" stroke="#f5f0e5" stroke-width="3" stroke-linecap="round"/><circle cx="45" cy="42" r="9" fill="#D0A350"/><path d="m41 42 3 3 5-6" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;

const state = {
  page: "login",
  user: "林晓",
  role: "项目主管",
  photos: [],
  uploading: false,
  reviewTab: "compare",
  selectedLine: 0,
  checked: {},
  selectedReview: 0,
  moreOpen: false,
  sheet: null,
  toast: "",
  docDate: "2026-11-12",
  project: "上海一店",
  filled: { employee: "", password: "" }
};

const LINES = [
  { name:"鸡胸肉", spec:"冷冻", unit:"kg", qty:"20", price:"18.50", amount:"370.00", flag:"warn", tip:"品名低置信，请对照原图" },
  { name:"土豆", spec:"中薯", unit:"斤", qty:"30", price:"2.40", amount:"72.00", flag:"", tip:"" },
  { name:"色拉油", spec:"5L", unit:"桶", qty:"2", price:"68.00", amount:"136.00", flag:"bad", tip:"高于合同价 ¥62.00" },
  { name:"香葱", spec:"", unit:"kg", qty:"1.50", price:"8.00", amount:"12.00", flag:"", tip:"" }
];
const DOCS = [
  { supplier:"沪东农产品", project:"上海一店", date:"11/12", status:"待主管审核", amount:"590.00", pill:"wait" },
  { supplier:"清河粮油", project:"杭州湾店", date:"11/12", status:"草稿", amount:"1,280.00", pill:"info" },
  { supplier:"江南鲜蔬", project:"上海一店", date:"11/11", status:"已通过", amount:"860.50", pill:"ok" },
  { supplier:"吴中冻品", project:"南京路店", date:"11/11", status:"退回补充", amount:"2,140.00", pill:"bad" }
];
const QUEUE = [
  { supplier:"沪东农产品", project:"上海一店", issues:"1 项超合同价 · 1 项低置信", amount:"590.00" },
  { supplier:"吴中冻品", project:"南京路店", issues:"金额与明细不一致", amount:"2,140.00" },
  { supplier:"沿海海鲜", project:"上海一店", issues:"无异常，可直接通过", amount:"3,020.00" }
];

function $(sel, root=document){ return root.querySelector(sel); }
function toast(msg){ state.toast = msg; render(); setTimeout(()=>{ if(state.toast===msg){ state.toast=""; render(); } }, 2400); }
function go(page){ state.page = page; state.moreOpen=false; state.sheet=null; if(page==="review") state.reviewTab="compare"; render(); }
function openIssues(){ return LINES.map((l,i)=>l.flag && !state.checked[i] ? i : -1).filter(i=>i>=0); }
function lineTotal(){ return LINES.reduce((s,l)=>s+(+l.amount||0),0).toFixed(2); }
function selectLine(i, opts={}){ if(i<0||i>=LINES.length) return; if(i===state.selectedLine && !opts.force) return; state.selectedLine=i; render(); if(opts.focus){ const el=document.querySelector(`[data-line="${i}"] [data-edit="${opts.focus}"]`); if(el){ el.focus(); el.select&&el.select(); } } }
function stepLine(dir){ selectLine(Math.min(LINES.length-1, Math.max(0, state.selectedLine+dir))); }
function nextIssue(){
  const issues=openIssues();
  if(!issues.length){ toast("问题行都已核对"); return; }
  const cur=issues.indexOf(state.selectedLine);
  selectLine(issues[cur===-1 ? 0 : (cur+1)%issues.length]);
}
function checkLine(){
  state.checked[state.selectedLine]=true;
  const rest=openIssues();
  state.toast = rest.length ? "已核对，已跳到下一条问题" : "问题行都已核对，可以提交";
  if(rest.length) state.selectedLine=rest[0];
  render();
  const msg=state.toast;
  setTimeout(()=>{ if(state.toast===msg){ state.toast=""; render(); } }, 2400);
}
function submitReview(){
  const left=openIssues();
  if(left.length){
    const names=left.map(i=>LINES[i].name).join("、");
    toast(`还有 ${left.length} 条未核对（${names}），请先处理或标明已核对`);
    selectLine(left[0]);
    return;
  }
  toast("已提交审核，等待主管处理");
}
function fillDemo(u,p){ state.filled = { employee:u, password:p }; render(); }

function navItem(id, hrefLabel, icon, label){
  const on = state.page===id || (id==="documents" && state.page==="review") || (id==="reviews" && state.page==="reviews");
  return `<button class="nav-item ${on?"is-on":""}" type="button" data-go="${id}"><span class="nav-ico">${icon}</span>${label}</button>`;
}

function shell(inner, title){
  const mobileNav = `
    <nav class="mobile-nav">
      <button class="${state.page==="dashboard"?"is-on":""}" data-go="dashboard">${ICO.home}工作台</button>
      <button class="${state.page==="documents"||state.page==="review"?"is-on":""}" data-go="documents">${ICO.file}单据中心</button>
      <div class="fab-wrap"><button class="fab" data-go="upload" title="新建单据">${ICO.plus}</button></div>
      <button class="${state.page==="reviews"?"is-on":""}" data-go="reviews">${ICO.check}审核</button>
      <button class="${state.moreOpen?"is-on":""}" data-more>${ICO.more}更多</button>
    </nav>`;
  return `
  <div class="app">
    <aside class="sidebar">
      <a class="logo" data-go="dashboard">${BRAND_MARK}<div><strong>食安链</strong><span>送货单识别与比价</span></div></a>
      <div class="scope"><small>当前数据范围</small><b>上海一店、杭州湾店</b></div>
      <nav class="nav">
        ${navItem("dashboard",0,ICO.home,"工作台")}
        ${navItem("upload",0,ICO.plus,"新建单据")}
        ${navItem("documents",0,ICO.file,"单据中心")}
        ${navItem("reviews",0,ICO.check,"审核队列")}
        ${navItem("business",0,ICO.chart,"项目经营")}
        ${navItem("analytics",0,ICO.chart,"价格分析")}
        <div class="nav-sec">基础资料</div>
        ${navItem("ingredients",0,ICO.box,"原材料")}
        ${navItem("master",0,ICO.db,"供应商与合同")}
        ${navItem("settings",0,ICO.gear,"系统设置")}
      </nav>
      <div class="user-card">
        <div class="avatar">${state.user.slice(0,1)}</div>
        <div><strong>${state.user}</strong><span>${state.role}</span></div>
        <button class="icon-btn" data-go="login" title="退出登录"><svg class="ico" viewBox="0 0 24 24"><path d="M10 6H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h4"/><path d="M14 16l5-4-5-4"/><path d="M19 12H10"/></svg></button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="mobile-title">${title}</div>
        <div class="crumb">${title==="工作台"?`<b>工作台</b>`:`工作台 <span>/</span> <b>${title}</b>`}</div>
        <div class="topbar-actions">
          <button class="btn btn--small btn--outline" type="button">反馈建议</button>
          <button class="btn btn--small btn--primary" data-go="upload">＋ 新建单据</button>
        </div>
      </header>
      <div class="content ${state.page==="upload" && document.documentElement.dataset.device==="mobile" ? "":""}">${inner}</div>
      ${((document.documentElement.dataset.device==="mobile"||document.documentElement.dataset.device==="tablet")&&state.page==="review")?`<div class="action-dock">
        <button class="btn btn--outline" data-toast="已保存草稿">保存</button>
        <button class="btn btn--primary" data-submit-review>提交审核</button>
      </div>`:""}
      ${state.moreOpen?`<div class="more-panel">
        <a data-go="business">${ICO.chart} 项目经营</a>
        <a data-go="analytics">${ICO.chart} 价格分析</a>
        <a data-go="ingredients">${ICO.box} 原材料</a>
        <a data-go="master">${ICO.db} 供应商与合同</a>
        <a data-go="settings">${ICO.gear} 系统设置</a>
        <a data-go="login">退出登录</a>
      </div>`:""}
      ${mobileNav}
      <div class="toast ${state.toast?"show":""}">${state.toast||""}</div>
      ${state.sheet||""}
    </div>
  </div>`;
}

function pageLogin(){
  return `<div class="login">
    <section class="login-story">
      <div class="logo" style="color:inherit">${BRAND_MARK}<div><strong>食安链</strong><span>送货单识别与比价</span></div></div>
      <div>
        <div class="login-kicker">餐饮供应链协同</div>

function slip(page=1){
  const items = page===1 ? [
    {i:0, name:"鸡胸肉", qty:"20kg", price:"18.5", amount:"370"},

    {i:3, name:"香葱", qty:"1.5kg", price:"8", amount:"12"}
  ] : [{i:-1, name:"（续页签章）", qty:"", price:"", amount:"590"}];
  const rows = items.map(r=>{
    const l = r.i>=0 ? LINES[r.i] : null;
    const on = r.i===state.selectedLine ? "is-on" : "";
    const fl = l && !state.checked[r.i] && l.flag ? `is-${l.flag}` : "";

  }).join("");
  return `<div class="slip"><h3>送 货 单 · ${page}/2</h3>
    <div>供货单位：沪东农产品　　收货：上海一店</div>

}

        <button class="link" type="button" data-toast="交互稿中未真正删除">删除此行</button>

  if(state.sheet==="project") state.sheet = projectSheet();
  screen.innerHTML = (pages[state.page]||pages.dashboard)();
  const hit=document.querySelector(".slip tr.is-on");
  if(hit) hit.scrollIntoView({block:"nearest"});
}

document.getElementById("themeSeg").addEventListener("click", e=>{
  const btn = e.target.closest("button[data-theme]"); if(!btn) return;
  document.documentElement.dataset.theme = btn.dataset.theme;
  [...e.currentTarget.children].forEach(b=>b.classList.toggle("is-on", b===btn));
  render();
});
document.getElementById("deviceSeg").addEventListener("click", e=>{
  const btn = e.target.closest("button[data-device]"); if(!btn) return;
  document.documentElement.dataset.device = btn.dataset.device;
  [...e.currentTarget.children].forEach(b=>b.classList.toggle("is-on", b===btn));
  render();
});
document.addEventListener("click", e=>{
  const t = e.target;
  const goBtn = t.closest("[data-go]"); if(goBtn){ e.preventDefault(); go(goBtn.dataset.go); return; }
  if(t.closest("[data-more]")){ state.moreOpen=!state.moreOpen; render(); return; }
  const demo = t.closest("[data-demo]"); if(demo){ const [u,p]=demo.dataset.demo.split(","); fillDemo(u,p); return; }
  if(t.closest("[data-add-photo]")){ if(state.photos.length<10 && !state.uploading){ state.photos.push({}); render(); } return; }
  const del = t.closest("[data-del-photo]"); if(del){ state.photos.splice(+del.dataset.delPhoto,1); render(); return; }
  if(t.closest("[data-start]")){
    if(!state.photos.length) return;
    state.uploading=true; render();
    setTimeout(()=>{ state.uploading=false; state.photos=[]; toast("识别完成，请核对明细"); go("review"); }, 1200);
    return;
  }
  if(t.closest("[data-sheet]")){ state.sheet = t.closest("[data-sheet]").dataset.sheet; render(); return; }
  if(t.closest("[data-close-sheet]") && !t.closest(".panel")){ state.sheet=null; render(); return; }
  if(t.closest("[data-apply-project]")){
    const p=$("#projectSel"), d=$("#dateSel");
    if(p) state.project=p.value; if(d) state.docDate=d.value; state.sheet=null; render(); return;
  }
  if(t.closest("[data-submit-review]")){ submitReview(); return; }
  if(t.closest("[data-check-line]")){ checkLine(); return; }
  if(t.closest("[data-next-issue]")){ nextIssue(); return; }
  const step=t.closest("[data-line-step]"); if(step){ stepLine(+step.dataset.lineStep); return; }
  const line=t.closest("[data-line]");
  if(line){
    const field=t.closest("[data-edit], input, select, textarea");
    if(field){ state.selectedLine=+line.dataset.line; return; }
    selectLine(+line.dataset.line);
    return;
  }
  const tab=t.closest("[data-review-tab]"); if(tab){ state.reviewTab=tab.dataset.reviewTab; render(); return; }
  const q=t.closest("[data-queue]"); if(q){ state.selectedReview=+q.dataset.queue; render(); return; }
  const ts=t.closest("[data-toast]"); if(ts){ toast(ts.dataset.toast); return; }
});
document.addEventListener("input", e=>{
  const f=e.target.closest("[data-edit]"); if(!f || state.page!=="review") return;
  const row=f.closest("[data-line]");
  const idx=row ? +row.dataset.line : state.selectedLine;
  state.selectedLine=idx;
  const line=LINES[idx];
  if(!line) return;
  line[f.dataset.edit]=f.value;
  if(f.dataset.edit==="qty" || f.dataset.edit==="price"){
    line.amount=((+line.qty||0)*(+line.price||0)).toFixed(2);
    document.querySelectorAll("[data-amount], [data-line-amount='"+idx+"']").forEach(el=>{
      el.textContent = el.hasAttribute("data-amount") ? ("¥"+line.amount) : line.amount;
    });
    document.querySelectorAll("[data-line-amount]").forEach(el=>{
      const n=LINES[+el.getAttribute("data-line-amount")];
      if(n) el.textContent = n.amount;
    });
    const total=lineTotal();
    document.querySelectorAll("[data-doc-total]").forEach(el=>el.textContent="¥"+total);
  }
  if(f.dataset.edit==="name"){
    const nameInputs=document.querySelectorAll(`[data-line="${idx}"] [data-edit="name"]`);
    nameInputs.forEach(el=>{ if(el!==f) el.value=f.value; });
  }
});
document.addEventListener("change", e=>{
  const f=e.target.closest("[data-edit]"); if(!f || state.page!=="review") return;
  const row=f.closest("[data-line]");
  const idx=row ? +row.dataset.line : state.selectedLine;
  if(LINES[idx]) LINES[idx][f.dataset.edit]=f.value;
});
document.addEventListener("keydown", e=>{
  if(state.page!=="review") return;
  const typing=["INPUT","SELECT","TEXTAREA"].includes(e.target.tagName);
  if(e.key==="ArrowDown" && !typing){ e.preventDefault(); stepLine(1); }
  else if(e.key==="ArrowUp" && !typing){ e.preventDefault(); stepLine(-1); }
  else if((e.key==="n"||e.key==="N") && !typing){ e.preventDefault(); nextIssue(); }
  else if(e.key==="Enter" && !e.shiftKey){
    if(typing && e.target.tagName!=="TEXTAREA"){ e.preventDefault(); e.target.blur(); }
    if(!typing || e.target.tagName==="INPUT"){
      const line=LINES[state.selectedLine];
      if(line.flag && !state.checked[state.selectedLine]) checkLine();
      else if(openIssues().length) nextIssue();
    }
  }
});
document.addEventListener("submit", e=>{
  if(e.target.matches("[data-login]")){ e.preventDefault(); go("dashboard"); toast("已登录，进入工作台"); }
});

(function(){
  const params = new URLSearchParams(location.search);
  if (params.get("theme")) {
    document.documentElement.dataset.theme = params.get("theme");
    document.querySelectorAll("#themeSeg button").forEach(b => b.classList.toggle("is-on", b.dataset.theme===params.get("theme")));
  }
  if (params.get("device")) {
    document.documentElement.dataset.device = params.get("device");
    document.querySelectorAll("#deviceSeg button").forEach(b => b.classList.toggle("is-on", b.dataset.device===params.get("device")));
  }
  if (params.get("page")) state.page = params.get("page");
  if (params.get("photos")) state.photos = Array.from({length: Math.min(10, +params.get("photos")||0)}, ()=>({}));
  if (params.get("tab")) state.reviewTab = params.get("tab");
})();
render();
</script>
</body>
</html>
